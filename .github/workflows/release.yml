name: release

# Builds the Windows x64 binary and publishes it as a GitHub Release asset.
# Binaries are never committed to the repository: push a tag and this workflow
# produces the exe plus its checksums.
#
#   git tag -a v1.0.0 -m "GoTerm 1.0.0"      # then: git push origin v1.0.0
#
# Running it by hand (Actions -> release -> Run workflow) builds the same thing
# and publishes it under the tag you type in.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.0). Created at the selected ref if it does not exist.'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.0.0

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve the version
        id: version
        run: |
          $raw = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { $env:GITHUB_REF_NAME }
          if (-not $raw) { throw 'no tag to release' }
          $v = $raw.TrimStart('v')
          "tag=$raw"     | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "semver=$v"    | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "releasing $raw (version $v)"

      - name: Stamp the version into the source
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.semver }}'
          # The status bar reads app.go's constant; the Windows file properties
          # read build/config.yml. Neither is committed back.
          (Get-Content app.go -Raw) -replace 'const Version = "[^"]*"', ('const Version = "' + $v + '"') |
            Set-Content app.go -NoNewline -Encoding utf8
          (Get-Content build/config.yml -Raw) -replace '(?m)^  version: ".*"', ('  version: "' + $v + '"') |
            Set-Content build/config.yml -Encoding utf8

      - name: Build
        run: wails3 build

      - name: Checksums
        id: sums
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.semver }}'
          $name = "goterm-v$v-windows-x64.exe"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item bin\goterm.exe "out\$name"
          $md5 = (Get-FileHash "out\$name" -Algorithm MD5).Hash.ToLower()
          $sha = (Get-FileHash "out\$name" -Algorithm SHA256).Hash.ToLower()
          # md5sum-compatible, so `md5sum -c` works on the other side.
          "$md5  $name`n" | Out-File -FilePath "out\$name.md5" -Encoding ascii -NoNewline
          "$sha  $name`n" | Out-File -FilePath "out\$name.sha256" -Encoding ascii -NoNewline
          "md5=$md5"   | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$name"  | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Get-ChildItem out | Format-Table Name, Length | Out-String | Write-Host

      - name: Summarise
        shell: pwsh
        run: |
          $tag  = '${{ steps.version.outputs.tag }}'
          $name = '${{ steps.sums.outputs.name }}'
          $md5  = '${{ steps.sums.outputs.md5 }}'
          $sha  = '${{ steps.sums.outputs.sha256 }}'
          $lines = @(
            "### GoTerm $tag (Windows x64)",
            '',
            '| | |',
            '| --- | --- |',
            "| file | $name |",
            "| MD5 | $md5 |",
            "| SHA256 | $sha |",
            '',
            "Built from ${{ github.sha }} with Go and Wails ${{ env.WAILS_VERSION }}."
          )
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: goterm-${{ steps.version.outputs.tag }}-windows-x64
          path: out/*
          if-no-files-found: error

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $name = '${{ steps.sums.outputs.name }}'
          $files = @("out\$name", "out\$name.md5", "out\$name.sha256")

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Re-running a release (moved tag, manual dispatch): replace the assets.
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files `
              --title "GoTerm $tag" `
              --generate-notes `
              --notes "Windows x64, single portable executable, not code-signed (SmartScreen warns on first run). Checksums are attached as .md5 and .sha256."
          }
