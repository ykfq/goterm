name: release

# Builds the Windows x64 app with mygo and publishes it as a GitHub Release
# asset. Binaries are never committed: push a tag and this workflow produces a
# zip with the executable, the terminal library it loads, and checksums.
#
#   git tag -a v2.0.0 -m "GoTerm 2.0.0"      # then: git push origin v2.0.0
#
# Running it by hand (Actions -> release -> Run workflow) builds the same thing
# under the tag you type in.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v2.0.0). Created at the selected ref if it does not exist.'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve the version
        id: version
        shell: pwsh
        env:
          # github.event.inputs is empty rather than undefined on a tag push, so
          # this expression resolves for both trigger types.
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          # Resolve the tag from runtime variables only, so neither event path
          # needs an expression that is absent for the other one.
          #
          # This step used to branch on '${{ github.event_name }}' and read
          # '${{ inputs.tag }}'. On a tag push there is no inputs context, and an
          # expression that cannot be resolved is what stopped the release:
          # the failure showed up as a null-method exception on the next line
          # rather than a message anyone could act on.
          $raw = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          if ([string]::IsNullOrWhiteSpace($raw)) {
            throw "no tag to release (event=$env:GITHUB_EVENT_NAME ref=$env:GITHUB_REF name=$env:GITHUB_REF_NAME)"
          }
          $raw = $raw.Trim()
          $v = $raw -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($v)) { throw "tag '$raw' has no version in it" }
          $declared = (Get-Content mygo.json -Raw | ConvertFrom-Json).version
          if ($declared -ne $v) {
            throw "tag $raw does not match mygo.json version $declared"
          }
          # GITHUB_OUTPUT must be written as plain UTF-8 with no BOM: a BOM makes
          # the first key arrive as "\ufefftag", the runner cannot find it, and
          # every later '${{ steps.version.outputs.x }}' expands to nothing.
          function Set-Output([string]$k, [string]$v) {
            if (-not $env:GITHUB_OUTPUT) { throw 'GITHUB_OUTPUT is not set' }
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$k=$v`n", (New-Object System.Text.UTF8Encoding($false)))
          }
          Set-Output 'tag' $raw
          Set-Output 'semver' $v
          Write-Host "releasing $raw"

      - name: Stamp the version into the source
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.semver }}'
          # The status bar reads app.go's constant; mygo build reads
          # mygo.json for the executable's version resource. Neither is
          # committed back.
          (Get-Content app.go -Raw) -replace 'const Version = "[^"]*"', ('const Version = "' + $v + '"') |
            Set-Content app.go -NoNewline -Encoding utf8
          $cfg = Get-Content mygo.json -Raw | ConvertFrom-Json
          $cfg.version = $v
          $cfg | ConvertTo-Json -Depth 8 | Set-Content mygo.json -Encoding utf8

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        run: go tool mygo build -platform windows/amd64 -o out -skip-installer

      - name: Package
        id: sums
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.semver }}'
          $name = "goterm-v$v-windows-x64"
          $dir = "out\$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item out\windows-amd64\GoTerm.exe "$dir\goterm.exe"
          Copy-Item out\windows-amd64\ghostty-vt.dll "$dir\ghostty-vt.dll"
          Copy-Item LICENSE, NOTICE $dir
          Compress-Archive -Path "$dir\*" -DestinationPath "out\$name.zip" -Force

          $md5 = (Get-FileHash "out\$name.zip" -Algorithm MD5).Hash.ToLower()
          $sha = (Get-FileHash "out\$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$md5  $name.zip`n"  | Out-File -FilePath "out\$name.zip.md5" -Encoding ascii -NoNewline
          "$sha  $name.zip`n"  | Out-File -FilePath "out\$name.zip.sha256" -Encoding ascii -NoNewline
          function Set-Output([string]$k, [string]$v) {
            if (-not $env:GITHUB_OUTPUT) { throw 'GITHUB_OUTPUT is not set' }
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "$k=$v`n", (New-Object System.Text.UTF8Encoding($false)))
          }
          Set-Output 'md5' $md5
          Set-Output 'sha256' $sha
          Set-Output 'name' $name
          Get-ChildItem out | Format-Table Name, Length | Out-String | Write-Host

      - name: Summarise
        shell: pwsh
        run: |
          $tag  = '${{ steps.version.outputs.tag }}'
          $name = '${{ steps.sums.outputs.name }}'
          $md5  = '${{ steps.sums.outputs.md5 }}'
          $sha  = '${{ steps.sums.outputs.sha256 }}'
          $lines = @(
            "### GoTerm $tag (Windows x64, native UI)",
            '',
            "| | |",
            "| --- | --- |",
            "| file | $name.zip |",
            "| MD5 | $md5 |",
            "| SHA256 | $sha |",
            '',
            "Built from ${{ github.sha }} with Go and mygo. No WebView2, no Node."
          )
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: goterm-${{ steps.version.outputs.tag }}-windows-x64
          path: out/goterm-*.zip*
          if-no-files-found: error

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $name = '${{ steps.sums.outputs.name }}'
          $files = @("out\$name.zip", "out\$name.zip.md5", "out\$name.zip.sha256")

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files `
              --title "GoTerm $tag" `
              --generate-notes `
              --notes "Windows x64, native UI in pure Go (mygo + Ghostty's terminal emulator). Unzip both files, then run goterm.exe. Not code-signed, so SmartScreen warns on first run. Checksums are attached."
          }
